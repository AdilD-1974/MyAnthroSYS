# ─────────────────────────────────────────────────────────────────────────────
# Nginx — PersonaHub HR
# Reverse proxy : React (Vite) + FastAPI sur le même domaine
# Frontend : /          → fichiers statiques Vite (dist/)
# API      : /api/v1/   → FastAPI (port 8000)
# ─────────────────────────────────────────────────────────────────────────────

upstream fastapi_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name votre-domaine.ma www.votre-domaine.ma;

    # Redirection HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name votre-domaine.ma www.votre-domaine.ma;

    # ── SSL (Let's Encrypt via certbot) ──────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/votre-domaine.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/votre-domaine.ma/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # ── Sécurité ─────────────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Taille max upload (photos collaborateurs) ─────────────────────────────
    client_max_body_size 10M;

    # ── API FastAPI ───────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Timeouts (pour les exports Excel lourds)
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # Cache désactivé pour l'API
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Documentation Swagger (dev/staging uniquement) ────────────────────────
    location /docs {
        # Commenter en production si vous ne voulez pas exposer la doc
        proxy_pass http://fastapi_backend/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://fastapi_backend/openapi.json;
    }

    # ── Health check ──────────────────────────────────────────────────────────
    location /health {
        proxy_pass http://fastapi_backend/;
        access_log off;
    }

    # ── Frontend React (SPA) ─────────────────────────────────────────────────
    location / {
        root   /var/www/personahub-hr/dist;
        index  index.html;

        # SPA routing : toutes les URLs inconnues → index.html
        try_files $uri $uri/ /index.html;

        # Cache agressif pour les assets avec hash (JS/CSS)
        location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Pas de cache pour index.html
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/personahub_access.log;
    error_log  /var/log/nginx/personahub_error.log warn;
}
