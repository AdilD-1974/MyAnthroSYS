version: "3.9"

services:

  # ── Base de données PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: personahub_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: personahub_hr
      POSTGRES_USER: personahub
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changez_moi}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personahub -d personahub_hr"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API FastAPI ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personahub_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://personahub:${DB_PASSWORD:-changez_moi}@db:5432/personahub_hr
      SECRET_KEY: ${SECRET_KEY:-changez-moi-avec-openssl-rand-hex-32}
      APP_ENV: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"

  # ── pgAdmin (interface base de données) — optionnel ─────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: personahub_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@personahub.ma
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - db
    profiles:
      - tools  # Lancer avec : docker compose --profile tools up

volumes:
  postgres_data:
    name: personahub_postgres_data
